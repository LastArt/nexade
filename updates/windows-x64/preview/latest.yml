version: 0.5.2
releaseNotes: |
  # NEXADE 0.5.2

  Предварительный выпуск. Первый контур автоматической установки обновлений — Windows x64 NSIS.

  ## Обновления

  - Справа внизу приложения появились иконка состояния и текущая версия. Нажатие открывает историю изменений с поиском, проверку, загрузку и установку.
  - Официальный канал и автоматические проверки встроены в приложение. Пользователю не нужно указывать сервер, выбирать канал, настраивать интервалы или разрешать неподписанные сборки отдельным флагом. Недоступный сервер отображается ошибкой, а не отсутствием новой версии.
  - Установщик скачивается полностью, без differential/blockmap. Размер, SHA-512 и совместимость проверяются; загрузка не приводит к автоматической установке при выходе.
  - Установка начинается только по вашему действию. Работающие агенты, сценарии, терминалы, SQL, sync и операции с проектами/снимками требуют завершения или откладывания обновления. Запрос остановки не считается завершением процесса.
  - Перед установкой оба окна сохраняют черновики и подтверждают готовность. Открытые редакторы и непостоянные вложения не теряются молча. Результат межверсионного перехода фиксируется, неопределённая установка не повторяется автоматически.

  ## Первый переход и подпись

  Установленная 0.5.1 не содержит обновлятора. Первый переход на 0.5.2 выполняется вручную после завершения активных задач.

  Текущие предварительные сборки не подписаны. В этой сборке используется только встроенный официальный канал: проверяются совместимость, размер и контрольная сумма установщика; подтверждение издателя не заявляется. Установка всегда начинается только по нажатию пользователя. Политика стабильного канала предусматривает подпись издателя.

  ## Запуск интерфейса

  Если модуль интерфейса не загрузился или React не смог его отобразить, вместо пустого окна выводятся понятная ошибка и кнопка перезагрузки. Данные проектов автоматически не сбрасываются.

  macOS и Linux пока обновляются вручную. Цели упаковки для этих платформ сохранены. Публичные вложения остаются только установщиками — Windows EXE, macOS Intel DMG, Linux AppImage/DEB. ZIP приложения и служебные отчёты не загружаются в Releases. Минимальный клиентский feed размещается отдельно на Pages.

  ## macOS Apple Silicon

  Установщик для macOS Apple Silicon пока недоступен: GitHub не предоставил runner для проверки. В этой публикации macOS представлена установщиком для Intel.
