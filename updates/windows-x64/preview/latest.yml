version: 0.5.3
releaseNotes: "# NEXADE 0.5.3\r\n\r\nОбновление работы с проектами, агентами и очередью задач.\r\n\r\n- Меню проектов: недавние проекты, поиск, открытие папки, сканирование и импорт из GitHub или GitLab.\r\n- Изолированные рабочие папки участников DevTrack и отдельный перенос результатов в DevTrack и основной проект с предпросмотром и подтверждением.\r\n- Единая очередь для приложения и Telegram. Свободному агенту можно написать обычное сообщение; сообщения во время работы сохраняются по порядку.\r\n- Просмотр завершённого ответа отмечается автоматически. Очередь может продолжиться после просмотра; кнопка «Ждать аудита» сохраняет явную паузу.\r\n- Исправлено продолжение диалога после ошибки или остановки. При отсутствии входа в Codex сообщение остаётся в редакторе и показывает понятную причину.\r\n- Telegram-компаньон: уведомления из всех проектов и веток, вопросы с вариантами ответа и готовые действия. Токен вводится в локальной форме, привязка подтверждается на компьютере.\r\n- Инструменты памяти, Бэклога, ролей, навыков, подключений, схем БД и чтения публичных страниц с проверкой прав текущего агента.\r\n- Условная оценка стоимости в панели, трассировке и статистике. Тариф и неполнота данных показаны явно.\r\n\r\nTelegram работает, пока запущено приложение на компьютере. Привязка и доставка системного уведомления подтверждены с живым ботом; полный живой цикл вопросов и кнопок остаётся дополнительной ручной проверкой. При неизвестном состоянии процессов рабочая папка остаётся заблокированной до сверки.\r\n\r\nAndroid-приложение, личный VPS, облачный канал и Virtual Agents Room в этот выпуск не входят.\r\n"
